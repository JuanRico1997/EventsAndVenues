# Mensajes de validación personalizados para Events

# Event validations
event.name.required=El nombre del evento es obligatorio
event.name.size=El nombre del evento debe tener entre 3 y 100 caracteres
event.description.size=La descripción del evento no puede exceder 500 caracteres
event.eventDate.required=La fecha del evento es obligatoria
event.eventDate.future=La fecha del evento debe ser futura
event.dateRange.invalid=La fecha de inicio debe ser anterior a la fecha de fin
event.venueId.required=El evento debe estar asociado a un venue
event.capacity.positive=La capacidad debe ser un número positivo
event.ticketPrice.positive=El precio del ticket debe ser un número positivo o cero

# Venue validations
venue.name.required=El nombre del venue es obligatorio
venue.name.size=El nombre del venue debe tener entre 3 y 100 caracteres
venue.location.required=La ubicación del venue es obligatoria
venue.location.size=La ubicación debe tener entre 5 y 200 caracteres
venue.description.size=La descripción del venue no puede exceder 500 caracteres
venue.capacity.positive=La capacidad debe ser un número positivo

# Generic validations
validation.field.required=Este campo es obligatorio
validation.field.invalid=El valor proporcionado no es válido

# Error messages
error.notfound=El recurso solicitado no fue encontrado
error.constraint.violation=Violación de restricción de integridad en la base de datos
error.internal=Ocurrió un error interno en el servidor

# JWT Configuration
jwt.secret=EventsAndVenuesSecretKeyForJWTTokenGenerationMustBe256BitsLongOrMoreForHS256Algorithm
jwt.expiration=86400000