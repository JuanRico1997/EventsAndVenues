spring.application.name=EventsAndVenues

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# Logging
logging.level.com.riwi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hibernate Statistics
spring.jpa.properties.hibernate.generate_statistics=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Batch Fetching - Optimiza lazy loading cuando se cargan múltiples entidades
spring.jpa.properties.hibernate.default_batch_fetch_size=10

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Internacionalización y mensajes de validación
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# JWT Configuration
jwt.secret=EventsAndVenuesSecretKeyForJWTTokenGenerationMustBe256BitsLongOrMoreForHS256Algorithm
jwt.expiration=86400000

# ============================================
# ACTUATOR & METRICS CONFIGURATION
# ============================================

# Actuator endpoints exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Metrics export to Prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Info endpoint
info.app.name=Events and Venues API
info.app.version=1.0.0
info.app.description=Sistema de gestión de eventos y venues con autenticación JWT
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# Metrics tags
management.metrics.tags.application=EventsAndVenues
management.metrics.tags.environment=development